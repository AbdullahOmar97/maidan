name: Deploy MAIDAN to EC2 Production

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::182399710468:role/GitHubActions-MAIDAN-Deploy
          aws-region: eu-central-1

      - name: Trigger Deployment and Fetch Logs
        run: |
          # 1. Send the command using tag-based targeting
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Environment,Values=production" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ubuntu/maidan", "sudo -u ubuntu git reset --hard", "sudo -u ubuntu git clean -fd", "sudo -u ubuntu git pull origin main", "sudo -u ubuntu bash /home/ubuntu/maidan/deploy.sh"]' \
            --comment "Deploy via GitHub Actions" \
            --query "Command.CommandId" \
            --output text)
            
          echo "Command sent successfully. ID: $COMMAND_ID"
          echo "Waiting for target instance resolution..."

          TARGET_INSTANCE_ID="None"
          for i in {1..12}; do
            sleep 5
            TARGET_INSTANCE_ID=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --query "CommandInvocations[0].InstanceId" \
              --output text)
            if [ "$TARGET_INSTANCE_ID" != "None" ] && [ -n "$TARGET_INSTANCE_ID" ]; then
              break
            fi
          done

          if [ "$TARGET_INSTANCE_ID" == "None" ] || [ -z "$TARGET_INSTANCE_ID" ]; then
            echo "❌ ERROR: No active instance found matching tag 'Environment=production'."
            echo "Please verify that the EC2 instance has tag Key: Environment, Value: production"
            exit 1
          fi

          echo "Target Instance ID: $TARGET_INSTANCE_ID"
          echo "Waiting for the server to finish execution..."

          # 2. Custom wait loop
          STATUS="InProgress"
          while [ "$STATUS" == "InProgress" ] || [ "$STATUS" == "Pending" ] || [ "$STATUS" == "Delayed" ]; do
            sleep 15  # Wait 15 seconds between each check
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE_ID" \
              --query "Status" \
              --output text)
            echo "Current status: $STATUS..."
          done

          # 3. Fetch and print outputs
          echo "======================================"
          echo "✅ Script output (Logs):"
          echo "======================================"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$TARGET_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          echo "======================================"
          echo "❌ Errors:"
          echo "======================================"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$TARGET_INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text

          # 4. Declare final result to GitHub
          if [ "$STATUS" != "Success" ]; then
            echo "⚠️ Deployment failed inside the server! Check the errors."
            exit 1
          else
            echo "🎉 Deployment completed successfully!"
          fi
